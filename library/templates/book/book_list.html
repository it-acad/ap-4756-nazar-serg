{% extends 'base.html' %}
{% block content %}

    <h1>All Books</h1>

    <form method="GET" action="{% url 'book_list' %}">
        <input type="text" name="q" value="{{ query }}" placeholder="Search by title, description or author...">
        <button type="submit">Search / Filter</button>
        {% if query %}
            <a href="{% url 'book_list' %}">Reset</a>
        {% endif %}
    </form>

    <hr>

    <ul class="list-group">
        {% for book in books %}
            <li class="list-group-item">
                <a href="{% url 'book_detail' book.id %}"><strong>{{ book.name }}</strong></a>
                — Available: {{ book.count }}
            </li>
        {% empty %}
            <li>No books found.</li>
        {% endfor %}
    </ul>
{% endblock %}
